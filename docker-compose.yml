services:
  db:
    image: postgres:16
    container_name: avenue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avenue
      POSTGRES_PASSWORD: avenue_pass
      POSTGRES_DB: avenue_stays
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
